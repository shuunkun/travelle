# Netlify build settings for this Next.js app.
# Netlify's Next.js adapter is applied automatically when it sees `next` in
# package.json; these values ensure the build runs and publishes `.next`
# even if the site's UI settings were saved before the app code was pushed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The Next.js runtime turns the `.next` output into Netlify functions +
# static assets. It is normally attached automatically at site creation,
# but this site was created before the app code existed, so declare it here.
[[plugins]]
  package = "@netlify/plugin-nextjs"
